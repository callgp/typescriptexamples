<div *ngIf="isLoggedIn"> Welcome, {{username}}</div>
<div *ngIf="!isLoggedIn"> login please</div>
<div *ngIf="!isLoggedIn&&check"> loggedin</div>
<div *ngIf="!isLoggedIn||check"> loggesin</div>

<div *ngIf="isLoggedIn; else loggedOut"> welcomess  {{username}}</div>
<ng-template #loggedOut>pl login</ng-template>

<ul>
  <li *ngFor="let name of names; let i=index">{{i}}{{name}}</li>
</ul>

<div [ngSwitch]="grade">
  <p *ngSwitchCase="'A'">Excellent</p>
  <p *ngSwitchCase="'B'">good</p>
  <p *ngSwitchCase="'C'">bad</p>
  <p *ngSwitchDefault>uk</p>
</div>
