<div>


    <h2> User</h2>
    <form #userForm="ngForm" (ngSubmit)="submitForm(userForm)">
    
    <div>
         <label for="name">Name</label>
         <input type="text" 
         id="name"
         name="name"
          [(ngModel)]="user.name"
           required />
    </div>


    <div>
        <label for="email">Email</label>
        <input type="email" 
        id="email"
        name="name"
         [(ngModel)]="user.name"
          required />
   </div>


   <div>
  <button type="submit">Submit</button>
</div>

    </form>
</div>
